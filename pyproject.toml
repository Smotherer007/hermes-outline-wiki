[project]
name = "hermes-outline-wiki"
version = "1.0.0"
description = "Outline wiki plugin for Hermes Agent: search, read, write, organise and comment on Outline documents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Patrick Weppelmann" }]
requires-python = ">=3.11"
# Standard library only. Hermes installs [project].dependencies into its own
# virtualenv on `hermes plugins install`, so this list stays empty on purpose.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]
