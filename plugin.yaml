name: outline-wiki
version: 1.0.1
description: "Outline wiki for Hermes: search, read, write, organise and comment on Outline documents, across several workspaces."
author: Patrick Weppelmann
kind: standalone
# Declared 1 on purpose. Every field below is additive and understood by v1
# readers, while Hermes releases up to 2026.9.14 ship an installer that rejects
# any declaration above 1 outright (_SUPPORTED_MANIFEST_VERSION in
# hermes_cli/plugins_cmd.py) even though their own manifest parser accepts 2.
# Declaring 2 therefore only ever surfaces as
#   Error: Plugin 'outline-wiki' requires manifest_version 2, but this installer
#   only supports up to 1
# and buys nothing: nothing in this plugin needs a v2-only capability.
# Fixed upstream in 2026.9.21; bump this back once the oldest Hermes you support
# understands a v2 declaration.
manifest_version: 1
api_version: 1
license: MIT
homepage: https://github.com/Smotherer007/hermes-outline-wiki
tags: [outline, wiki, knowledge-base, documentation]
provides_tools:
  - outline_setup
  - outline_status
  - outline_profile
  - outline_collections
  - outline_structure
  - outline_search
  - outline_list
  - outline_read
  - outline_create
  - outline_update
  - outline_move
  - outline_archive
  - outline_delete
  - outline_comments
  - outline_comment
  - outline_export
provides_hooks:
  - pre_tool_call
# No requires_env on purpose: workspaces can be configured at runtime with
# outline_setup, from a config file, or from these optional variables.
optional_env:
  - name: OUTLINE_URL
    description: "Workspace URL, e.g. https://acme.getoutline.com (optional; alternative to outline_setup)"
  - name: OUTLINE_API_KEY
    description: "Outline API key from Settings -> API & Apps, starts with ol_api_"
    secret: true
  - name: OUTLINE_DESCRIPTION
    description: "One line on what this wiki holds"
  - name: OUTLINE_CONFIG
    description: "Path to the profile file (default: $HERMES_HOME/outline-config.json)"
config_schema:
  safety_level:
    type: str
    choices: [open, confirm, readonly]
    default: open
    label: "Safety level"
    description: "open: write tools run directly. confirm: every write goes through the Hermes approval gate. readonly: write tools are blocked."
